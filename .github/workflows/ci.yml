name: Homebrew formula regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  formula:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ruby -c Formula/ai-barracks.rb
      - name: Install published archive through local tap
        run: |
          brew tap ai-barracks/ai-barracks "$GITHUB_WORKSPACE"
          brew install ai-barracks/ai-barracks/ai-barracks
          brew test ai-barracks/ai-barracks/ai-barracks
          # Expected version comes from the formula url, so a release bump needs no CI edit.
          expected="$(sed -n 's|.*refs/tags/\(v[0-9.]*\)\.tar\.gz.*|\1|p' Formula/ai-barracks.rb)"
          test -n "$expected" && test "$(aib version)" = "aib $expected"
